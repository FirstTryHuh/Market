name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 12 */5 * *'  # every 5 days at noon
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl "https://hmwzbvmyirpdvdeuqhdu.supabase.co/rest/v1/List?select=*&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
